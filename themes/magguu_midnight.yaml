Magguu Midnight:
  # `modes.dark` bases the theme on the default dark theme and `modes.light` on the default light theme
  # (HA docs, Dark mode support), so variables not set here fall back to a matching default.
  # Both modes define the same mag-* tokens (test_theme.py); contrast is checked by calculation (WCAG AA).
  modes:
    dark:
      primary-color: '#a891ff'
      accent-color: '#a891ff'
      primary-background-color: '#0e0f18'
      secondary-background-color: '#151624'
      card-background-color: 'rgba(24,25,39,0.94)'
      ha-card-background: 'rgba(24,25,39,0.94)'
      primary-text-color: '#f2f2fb'
      secondary-text-color: '#989caf'
      divider-color: 'rgba(255,255,255,0.06)'
      app-header-background-color: '#12131f'
      app-header-text-color: '#f2f2fb'
      sidebar-background-color: '#11121c'
      sidebar-selected-background-color: 'rgba(168,145,255,0.14)'
      sidebar-selected-icon-color: '#b9a6ff'
      sidebar-selected-text-color: '#f2f2fb'
      paper-item-icon-active-color: '#ffd166'
      state-light-active-color: '#ffd166'
      state-cover-active-color: '#71b7ff'
      state-climate-heat-color: '#ff9868'
      ha-card-border-radius: '24px'
      ha-section-border-radius: '28px'
      ha-section-background-color: 'rgba(255,255,255,0.018)'
      mag-surface: 'rgba(24,25,39,0.94)'
      mag-surface-soft: 'rgba(255,255,255,0.035)'
      mag-surface-active: 'rgba(255,255,255,0.07)'
      mag-surface-strong: 'rgba(24,25,39,0.96)'
      mag-overlay: 'rgba(255,255,255,0.055)'
      mag-overlay-border: 'rgba(255,255,255,0.045)'
      mag-weather-surface: 'rgba(255,255,255,0.045)'
      mag-hero-glow: 'rgba(90,76,170,0.34)'
      mag-border: 'rgba(255,255,255,0.06)'
      mag-text: '#f2f2fb'
      mag-text-muted: '#989caf'
      # Raum-Akzente (Hex aus den Karten) bleiben im Dunkelmodus unverändert; im Hellmodus werden sie zum Text-Ton hin abgedunkelt.
      mag-room-accent-strength: '100%'
      mag-room-accent-ink: '#f2f2fb'
      mag-accent-light: '#ffd166'
      mag-accent-climate: '#57cbd3'
      mag-accent-cover: '#71b7ff'
      mag-accent-success: '#79d98c'
      mag-accent-warning: '#ff9f43'
      mag-accent-error: '#ff6b6b'
      mag-accent-danger: '#ff6b6b'
      mag-accent-media: '#b48cff'
      mag-radius-card: '24px'
      mag-radius-control: '17px'
      mag-space-page-mobile: '10px'
      mag-space-page-wide: '18px'
      mag-space-card: '16px'
      mag-shadow-card: '0 16px 42px rgba(0,0,0,0.16)'
      mag-content-max-width: '1460px'
      mag-content-max-width-narrow: '760px'
      mag-space-navbar-clearance: '96px'
      lovelace-background: >-
        radial-gradient(circle at 20% -10%, rgba(100,76,190,.18), transparent 35%),
        radial-gradient(circle at 100% 5%, rgba(63,105,190,.10), transparent 32%),
        #0e0f18
    light:
      primary-color: '#6a4fd6'
      accent-color: '#6a4fd6'
      primary-background-color: '#f2f2f9'
      secondary-background-color: '#e8e8f3'
      card-background-color: '#ffffff'
      ha-card-background: 'rgba(255,255,255,0.96)'
      primary-text-color: '#171826'
      secondary-text-color: '#585c70'
      divider-color: 'rgba(15,23,42,0.10)'
      app-header-background-color: '#ffffff'
      app-header-text-color: '#171826'
      sidebar-background-color: '#ffffff'
      sidebar-selected-background-color: 'rgba(106,79,214,0.12)'
      sidebar-selected-icon-color: '#6a4fd6'
      sidebar-selected-text-color: '#171826'
      paper-item-icon-active-color: '#b45309'
      state-light-active-color: '#c27803'
      state-cover-active-color: '#1d4ed8'
      state-climate-heat-color: '#c2410c'
      ha-card-border-radius: '24px'
      ha-section-border-radius: '28px'
      ha-section-background-color: 'rgba(15,23,42,0.025)'
      mag-surface: 'rgba(255,255,255,0.96)'
      mag-surface-soft: 'rgba(15,23,42,0.035)'
      mag-surface-active: 'rgba(15,23,42,0.07)'
      mag-surface-strong: '#ffffff'
      mag-overlay: 'rgba(15,23,42,0.06)'
      mag-overlay-border: 'rgba(15,23,42,0.08)'
      mag-weather-surface: 'rgba(255,255,255,0.72)'
      mag-hero-glow: 'rgba(168,145,255,0.30)'
      mag-border: 'rgba(15,23,42,0.10)'
      mag-text: '#171826'
      mag-text-muted: '#585c70'
      mag-room-accent-strength: '40%'
      mag-room-accent-ink: '#171826'
      mag-accent-light: '#b45309'
      mag-accent-climate: '#0e7490'
      mag-accent-cover: '#1d4ed8'
      mag-accent-success: '#15803d'
      mag-accent-warning: '#b45309'
      mag-accent-error: '#b91c1c'
      mag-accent-danger: '#b91c1c'
      mag-accent-media: '#6d28d9'
      mag-radius-card: '24px'
      mag-radius-control: '17px'
      mag-space-page-mobile: '10px'
      mag-space-page-wide: '18px'
      mag-space-card: '16px'
      mag-shadow-card: '0 10px 28px rgba(15,23,42,0.08)'
      mag-content-max-width: '1460px'
      mag-content-max-width-narrow: '760px'
      mag-space-navbar-clearance: '96px'
      lovelace-background: >-
        radial-gradient(circle at 20% -10%, rgba(106,79,214,.10), transparent 35%),
        radial-gradient(circle at 100% 5%, rgba(63,105,190,.07), transparent 32%),
        #f2f2f9
