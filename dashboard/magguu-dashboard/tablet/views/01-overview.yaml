- title: Home
  path: overview
  icon: mdi:home
  theme: Magguu Midnight
  type: sections
  max_columns: 3
  sections:
    - type: grid
      column_span: 3
      cards:
        - type: custom:button-card
          template: hero_v5
          variables:
            show_weather: true
          grid_options:
            columns: full
        - !include ../../shared/navbar.yaml

    - type: grid
      column_span: 2
      cards:
        - type: heading
          heading: Als Nächstes
          heading_style: title
        - type: heading
          heading: Arbeit, Abfuhr und Termine auf einen Blick
          heading_style: subtitle
        - type: custom:button-card
          template: next_event_v5
          entity: calendar.arbeiten
          name: Arbeit
          icon: mdi:briefcase-outline
          variables: { accent: '#b48cff' }
          grid_options: { columns: 6 }
        - type: custom:button-card
          template: waste_event_v6
          entity: calendar.abfuhr
          name: Abfuhr
          icon: mdi:trash-can-outline
          variables: { accent: '#79d98c' }
          grid_options: { columns: 6 }
        - type: custom:button-card
          template: next_event_v5
          entity: calendar.privat
          name: Privat
          icon: mdi:account-heart-outline
          variables: { accent: '#e886ad' }
          grid_options: { columns: 6 }
        - type: custom:button-card
          template: next_event_v5
          entity: calendar.termine
          name: Termine
          icon: mdi:calendar-star
          variables: { accent: '#71b7ff' }
          grid_options: { columns: 6 }

    - !include ../../shared/sections/attention.yaml

    - type: grid
      column_span: 2
      cards:
        - type: heading
          heading: Wohnbereiche
          heading_style: title
        - type: heading
          heading: Direkte Steuerung – alle Räume auf der Raumseite
          heading_style: subtitle
        - !include ../../shared/cards/room-wohnzimmer.yaml
        - !include ../../shared/cards/room-esszimmer.yaml
        - !include ../../shared/cards/room-kueche.yaml
        - type: custom:mushroom-template-card
          grid_options: { columns: full, rows: auto }
          primary: Alle Räume öffnen
          secondary: Wohnzimmer, Küche, Bad, Schlaf- und Kinderzimmer
          icon: mdi:floor-plan
          icon_color: purple
          tap_action:
            action: navigate
            navigation_path: /magguu-tablet/raeume
          card_mod:
            style: |
              ha-card {
                border-radius: 20px;
                background: var(--mag-surface-soft, rgba(255,255,255,.035));
                border: 1px solid var(--mag-border, rgba(255,255,255,.06));
              }

    - type: grid
      cards:
        - !include ../../shared/cards/status-shortcuts.yaml
        - type: heading
          heading: Schnellzugriff
          heading_style: title
        - type: heading
          heading: Die häufigsten Aktionen
          heading_style: subtitle
        - !include ../../shared/cards/home-quick.yaml

    - !include ../../shared/sections/modes.yaml

    - !include ../../shared/sections/active-media.yaml
