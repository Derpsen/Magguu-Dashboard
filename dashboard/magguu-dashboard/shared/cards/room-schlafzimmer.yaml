type: custom:stack-in-card
mode: vertical
cards:
  - type: custom:button-card
    template: room_visual_v5
    name: Schlafzimmer
    icon: mdi:bed-king-outline
    variables:
      room_path: schlafzimmer
      accent: '#a891ff'
      light_count_entity: sensor.magguu_schlafzimmer_lichter_an
      temperature_entity: sensor.magguu_schlafzimmer_temperatur_c
      humidity_entity: sensor.schlafzimmer_schlafzimmer_thermostat_rel_luftfeuchte
      opening_entity: binary_sensor.magguu_schlafzimmer_oeffnung
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        template: room_action_v5
        entity: light.schlafzimmer_schlafzimmer
        name: Hauptlicht
        icon: mdi:ceiling-light
        variables: {accent: '#ffd166'}
      - type: custom:button-card
        template: room_action_v5
        entity: light.schlafzimmer_bett_links
        name: Bett links
        icon: mdi:lamp
        variables: {accent: '#b48cff'}
      - type: custom:button-card
        template: room_action_v5
        entity: light.schlafzimmer_bett_rechts
        name: Bett rechts
        icon: mdi:lamp
        variables: {accent: '#b48cff'}
      - type: custom:button-card
        template: room_link_v5
        name: Rollläden
        icon: mdi:window-shutter
        variables: {accent: '#71b7ff', room_path: schlafzimmer, link_label: 2 Rollläden}
      - type: custom:button-card
        template: room_action_v5
        entity: climate.schlafzimmer_schlafzimmer_thermostat
        name: Heizung
        icon: mdi:radiator
        tap_action: {action: more-info}
        variables: {accent: '#ff9868'}
card_mod:
  style: |
    ha-card {
      border-radius: var(--mag-radius-card, 24px);
      background: var(--mag-surface, rgba(24,25,39,.94));
      border: 1px solid var(--mag-border, rgba(255,255,255,.06));
      box-shadow: var(--mag-shadow-card, none);
      overflow: hidden;
    }
