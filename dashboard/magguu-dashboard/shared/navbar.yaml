type: custom:navbar-card
# Sections-View: Die Karte ist fixed positioniert (kein Platz im Fluss) und liegt immer in der ersten Section der Seite
# (alle Seiten inkl. Raum-/Dienste-Unterseiten). Am unteren Rand zentriert (docs: desktop.position bottom + mode floating),
# damit sie auf Handy und Tablet gleich aussieht und nicht links neben dem Inhalt schwebt; Auto-Padding hält unten Platz frei.
grid_options:
  columns: full
  rows: auto
layout:
  auto_padding:
    enabled: true
    desktop_px: 112
    mobile_px: 74
    media_player_px: 118
desktop:
  mode: floating
  position: bottom
  min_width: 768
  show_labels: true
mobile:
  show_labels: false
routes:
  - url: overview
    icon: mdi:home-outline
    icon_selected: mdi:home
    label: Zuhause
  - url: raeume
    icon: mdi:floor-plan
    label: Räume
  - url: klima
    icon: mdi:home-thermometer-outline
    label: Klima
  - url: medien
    icon: mdi:play-box-multiple-outline
    icon_selected: mdi:play-box-multiple
    label: Medien
  - url: kalender
    icon: mdi:calendar-month-outline
    icon_selected: mdi:calendar-month
    label: Kalender
  - url: sicherheit
    icon: mdi:shield-home-outline
    icon_selected: mdi:shield-home
    label: Sicherheit
  - url: energie
    icon: mdi:home-lightning-bolt-outline
    icon_selected: mdi:home-lightning-bolt
    label: Energie
  - url: system
    icon: mdi:cog-outline
    icon_selected: mdi:cog
    label: System
    badge:
      show: >-
        [[[
          return Number(states?.['sensor.magguu_wartung_offen']?.state || 0) > 0;
        ]]]
      count: >-
        [[[
          return Number(states?.['sensor.magguu_wartung_offen']?.state || 0);
        ]]]
styles: |
  .navbar {
    --navbar-primary-color: var(--primary-color);
    --navbar-background-color: color-mix(in srgb, var(--ha-card-background) 92%, transparent);
    backdrop-filter: blur(20px);
  }
