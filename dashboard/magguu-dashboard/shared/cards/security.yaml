- type: custom:button-card
  template: page_header_v6
  name: Sicherheit
  icon: mdi:shield-home-outline
  variables:
    subtitle: Anwesenheit, Alarmmeldungen und alle überwachten Öffnungen
    accent: '#79d98c'
  view_layout: {grid-area: hero}

- type: vertical-stack
  view_layout: {grid-area: status}
  cards:
    - type: custom:mushroom-title-card
      title: Hausstatus
      subtitle: Die wichtigsten Sicherheitszustände ohne Umwege

    - type: custom:mushroom-template-card
      entity: sensor.magguu_sicherheitsstatus
      primary: >-
        {{ 'Sofort prüfen' if states(entity) == 'kritisch'
           else 'Öffnungen prüfen' if states(entity) == 'pruefen'
           else 'Alles im grünen Bereich' }}
      secondary: "{{ state_attr(entity, 'summary') }}"
      multiline_secondary: true
      icon: "{{ state_attr(entity, 'icon') or 'mdi:shield-home-outline' }}"
      icon_color: >-
        {{ 'red' if states(entity) == 'kritisch'
           else 'orange' if states(entity) == 'pruefen'
           else 'green' }}
      tap_action: {action: more-info}
      card_mod: &security_card
        style: |
          ha-card {
            min-height: 112px;
            border-radius: var(--mag-radius-card, 24px);
            background:
              radial-gradient(circle at 90% 15%, rgba(121,217,140,.14), transparent 34%),
              var(--mag-surface, rgba(24,25,39,.94));
            border: 1px solid var(--mag-border, rgba(255,255,255,.06));
            box-shadow: var(--mag-shadow-card, none);
          }

    - type: grid
      columns: 3
      square: false
      cards:
        - type: custom:mushroom-template-card
          entity: person.magguu
          primary: Marco
          secondary: "{{ 'Zuhause' if is_state(entity, 'home') else 'Unterwegs' }}"
          icon: "{{ 'mdi:home-account' if is_state(entity, 'home') else 'mdi:account-arrow-right-outline' }}"
          icon_color: "{{ 'green' if is_state(entity, 'home') else 'grey' }}"
          tap_action: {action: more-info}
          card_mod: *security_card
        - type: custom:mushroom-template-card
          entity: sensor.magguu_offene_fenster
          primary: Öffnungen
          secondary: "{{ states(entity) }} geöffnet"
          icon: "{{ 'mdi:window-open-variant' if states(entity) | int(0) > 0 else 'mdi:window-closed-variant' }}"
          icon_color: "{{ 'orange' if states(entity) | int(0) > 0 else 'green' }}"
          tap_action: {action: more-info}
          card_mod: *security_card
        - type: custom:mushroom-template-card
          entity: sensor.openccu_servicemeldungen
          primary: OpenCCU
          secondary: >-
            {% set alarms = states('sensor.openccu_alarmmeldungen') | int(0) %}
            {% set summary = state_attr('sensor.magguu_openccu_meldungstext', 'summary') %}
            {% if alarms > 0 %}
              {{ alarms }} Alarmmeldung(en)
            {% elif states('sensor.magguu_openccu_meldungstext') | int(0) > 0 %}
              {{ summary }}
            {% else %}
              Keine Meldungen
            {% endif %}
          multiline_secondary: true
          icon: mdi:alarm-light-outline
          icon_color: >-
            {{ 'red' if states('sensor.openccu_alarmmeldungen') | int(0) > 0
               else 'orange' if states('sensor.magguu_openccu_meldungstext') | int(0) > 0
               else 'green' }}
          tap_action: {action: more-info}
          card_mod: *security_card

- type: vertical-stack
  view_layout: {grid-area: ring}
  cards:
    - type: custom:mushroom-title-card
      title: Vordereingang
      subtitle: Klingelereignisse und Türöffnung mit Bestätigung

    - type: grid
      columns: 3
      square: false
      cards:
        - type: custom:mushroom-template-card
          entity: event.vordereingang_klingeln
          primary: Klingeln
          secondary: >-
            {% set ts = as_timestamp(states(entity), none) %}
            {% if ts %}
              {{ ts | timestamp_custom('%d.%m. · %H:%M', true) }}
            {% else %}
              {{ states(entity) if states(entity) not in ['unknown', 'unavailable', ''] else 'Kein Ereignis' }}
            {% endif %}
          icon: mdi:doorbell-video
          icon_color: "{{ 'orange' if states(entity) not in ['unknown', 'unavailable', ''] else 'grey' }}"
          tap_action: {action: more-info}
          card_mod: *security_card
        - type: custom:mushroom-template-card
          entity: sensor.vordereingang_letzte_aktivitat
          primary: Letzte Aktivität
          secondary: >-
            {% set ts = as_timestamp(states(entity), none) %}
            {% if ts %}
              {{ ts | timestamp_custom('%d.%m. · %H:%M', true) }}
            {% else %}
              {{ states(entity) }}
            {% endif %}
          icon: mdi:clock-outline
          icon_color: blue
          tap_action: {action: more-info}
          card_mod: *security_card
        - type: custom:mushroom-template-card
          entity: sensor.vordereingang_batterie
          primary: Batterie
          secondary: "{{ states(entity) }} %"
          icon: mdi:battery
          icon_color: >-
            {% set value = states(entity) | int(0) %}
            {{ 'green' if value >= 50 else 'orange' if value >= 20 else 'red' }}
          tap_action: {action: more-info}
          card_mod: *security_card

    - type: custom:mushroom-template-card
      entity: button.vordereingang_tur_offnen
      primary: Tür öffnen
      secondary: Vordereingang · nur mit Bestätigung
      icon: mdi:door-open
      icon_color: orange
      tap_action:
        action: call-service
        service: button.press
        target:
          entity_id: button.vordereingang_tur_offnen
        confirmation:
          text: Vordereingangstür wirklich öffnen?
      hold_action: {action: more-info}
      card_mod: *security_card

    - type: custom:mushroom-template-card
      entity: event.vordereingang_gegensprechanlage_entsperren
      primary: Gegensprechanlage
      secondary: >-
        {% set ts = as_timestamp(states(entity), none) %}
        {% if ts %}
          Zuletzt entsperrt {{ ts | timestamp_custom('%d.%m. · %H:%M', true) }}
        {% else %}
          Kein Entsperr-Ereignis
        {% endif %}
      icon: mdi:deskphone
      icon_color: grey
      tap_action: {action: more-info}
      card_mod: *security_card

    - type: entities
      title: Klingel-Lautstärke
      show_header_toggle: false
      entities:
        - entity: number.vordereingang_turklingel_lautstarke
          name: Türklingel
        - entity: number.vordereingang_mikrofon_lautstarke
          name: Mikrofon
        - entity: number.vordereingang_sprach_lautstarke
          name: Sprache
      card_mod: *security_card

    - type: custom:mushroom-title-card
      title: Kinderzimmer
      subtitle: Live-Ansicht der Ring-Kamera

    - type: picture-entity
      entity: camera.kinderzimmer_live_ansicht
      name: Kinderzimmer
      show_name: true
      show_state: false
      tap_action: {action: more-info}
      card_mod: *security_card

    - type: grid
      columns: 3
      square: false
      cards:
        - type: custom:mushroom-template-card
          entity: sensor.kinderzimmer_batterie
          primary: Batterie
          secondary: "{{ states(entity) }} %"
          icon: mdi:battery
          icon_color: >-
            {% set value = states(entity) | int(0) %}
            {{ 'green' if value >= 50 else 'orange' if value >= 20 else 'red' }}
          tap_action: {action: more-info}
          card_mod: *security_card
        - type: custom:mushroom-template-card
          entity: sensor.kinderzimmer_letzte_aktivitat
          primary: Letzte Aktivität
          secondary: >-
            {% set ts = as_timestamp(states(entity), none) %}
            {% if ts %}
              {{ ts | timestamp_custom('%d.%m. · %H:%M', true) }}
            {% else %}
              {{ states(entity) }}
            {% endif %}
          icon: mdi:clock-outline
          icon_color: blue
          tap_action: {action: more-info}
          card_mod: *security_card
        - type: tile
          entity: number.kinderzimmer_lautstarke
          name: Lautstärke
          icon: mdi:volume-high
          features:
            - type: numeric-input
          card_mod: *security_card

- type: vertical-stack
  view_layout: {grid-area: details}
  cards:
    - !include heating-hints.yaml
    - !include openings.yaml

