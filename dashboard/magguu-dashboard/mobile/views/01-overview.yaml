- title: Home
  path: overview
  icon: mdi:home
  theme: Magguu Midnight
  type: sections
  max_columns: 1
  sections:
    - type: grid
      cards:
        - type: custom:button-card
          template: hero_v5
          grid_options:
            columns: full
        - !include ../../shared/navbar.yaml

    - !include ../../shared/sections/attention.yaml

    - type: grid
      cards:
        - !include ../../shared/cards/status-shortcuts.yaml

    - type: grid
      cards:
        - type: heading
          heading: Als Nächstes
          heading_style: title
        - type: custom:button-card
          template: next_event_v5
          entity: calendar.arbeiten
          name: Arbeit
          icon: mdi:briefcase-outline
          variables: { accent: '#b48cff' }
          grid_options: { columns: 6 }
        - type: custom:button-card
          template: waste_event_v6
          entity: calendar.abfuhr
          name: Abfuhr
          icon: mdi:trash-can-outline
          variables: { accent: '#79d98c' }
          grid_options: { columns: 6 }
        - type: custom:button-card
          template: next_event_v5
          entity: calendar.privat
          name: Privat
          icon: mdi:account-heart-outline
          variables: { accent: '#e886ad' }
          grid_options: { columns: 6 }
        - type: custom:button-card
          template: next_event_v5
          entity: calendar.termine
          name: Termine
          icon: mdi:calendar-star
          variables: { accent: '#71b7ff' }
          grid_options: { columns: 6 }
        - type: weather-forecast
          entity: weather.forecast_home
          name: Wetter
          forecast_type: daily
          grid_options: { columns: full, rows: auto }
          card_mod:
            style: |
              /* lange Wetterlagen („Teilweise bewölkt“) umbrechen statt mit „…“ abzuschneiden */
              .name-state .state {
                white-space: normal !important;
                font-size: var(--ha-font-size-xl, 20px) !important;
                line-height: 1.15 !important;
                overflow-wrap: anywhere;
              }
              ha-card {
                border-radius: var(--ha-section-border-radius, 28px);
                background: var(--mag-surface, rgba(24,25,39,.94));
                border: 1px solid var(--mag-border, rgba(255,255,255,.06));
                box-shadow: none;
              }

    - !include ../../shared/sections/active-media.yaml

    - type: grid
      cards:
        - type: heading
          heading: Räume
          heading_style: title
        - type: heading
          heading: Direkt steuern oder Raum öffnen
          heading_style: subtitle
        - !include ../../shared/cards/room-wohnzimmer.yaml
        - !include ../../shared/cards/room-esszimmer.yaml
        - !include ../../shared/cards/room-kueche.yaml
        - type: custom:mushroom-template-card
          grid_options: { columns: full, rows: auto }
          primary: Alle Räume
          secondary: Vollständige Raumübersicht öffnen
          icon: mdi:floor-plan
          icon_color: purple
          tap_action:
            action: navigate
            navigation_path: /magguu-mobile/raeume

    - type: grid
      cards:
        - type: heading
          heading: Schnellzugriff
          heading_style: title
        - !include ../../shared/cards/home-quick.yaml

    - !include ../../shared/sections/modes.yaml
