title: Schlafzimmer
path: schlafzimmer
icon: mdi:bed-king-outline
subview: true
theme: Magguu Midnight
type: sections
max_columns: 2
sections:
  - type: grid
    column_span: 2
    cards:
      - type: custom:button-card
        grid_options:
          columns: full
        template: room_detail_header_v7
        name: Schlafzimmer
        icon: mdi:bed-king-outline
        variables:
          subtitle: Licht, Raumklima und Rollläden
          accent: '#a891ff'
          temperature_entity: sensor.magguu_schlafzimmer_temperatur_c
          humidity_entity: sensor.schlafzimmer_schlafzimmer_thermostat_rel_luftfeuchte
          opening_entity: binary_sensor.magguu_schlafzimmer_oeffnung
          light_count_entity: sensor.magguu_schlafzimmer_lichter_an
          climate_entity: climate.schlafzimmer_schlafzimmer_thermostat
      - !include ../navbar.yaml

  - type: grid
    cards:
      - type: heading
        heading: Beleuchtung
        heading_style: title
      - type: heading
        heading: Raum- und Bettlichter dimmen
        heading_style: subtitle
      - type: tile
        grid_options:
          columns: full
        entity: light.schlafzimmer_schlafzimmer
        name: Schlafzimmer gesamt
        icon: mdi:lightbulb-group-outline
        color: amber
        features:
          - type: light-brightness
        card_mod: &detail_card
          style: |
            ha-card {
              border-radius: var(--mag-radius-card, 24px);
              background: var(--mag-surface, rgba(24,25,39,.94));
              border: 1px solid var(--mag-border, rgba(255,255,255,.06));
              box-shadow: var(--mag-shadow-card, none);
            }
      - type: tile
        grid_options:
          columns: full
        entity: light.schlafzimmer_bett_links
        name: Bett links
        icon: mdi:lamp-outline
        color: amber
        features:
          - type: light-brightness
        card_mod: *detail_card
      - type: tile
        grid_options:
          columns: full
        entity: light.schlafzimmer_bett_rechts
        name: Bett rechts
        icon: mdi:lamp-outline
        color: amber
        features:
          - type: light-brightness
        card_mod: *detail_card

  - type: grid
    cards:
      - type: heading
        heading: Klima
        heading_style: title
      - type: heading
        heading: Heizung und Verlauf
        heading_style: subtitle
      - type: tile
        grid_options:
          columns: full
        entity: climate.schlafzimmer_schlafzimmer_thermostat
        name: Schlafzimmer
        features:
          - type: target-temperature
        card_mod: *detail_card
      - type: custom:mini-graph-card
        name: Temperatur · 48 Stunden
        hours_to_show: 48
        points_per_hour: 1
        line_width: 2
        show: {labels: true, legend: false, fill: fade}
        entities:
          - sensor.magguu_schlafzimmer_temperatur_c
        card_mod: *detail_card

  - type: grid
    cards:
      - type: heading
        heading: Rollläden
        heading_style: title
      - type: heading
        heading: Beide Seiten gezielt positionieren
        heading_style: subtitle
      - type: tile
        grid_options:
          columns: full
        entity: cover.schlafzimmer_schlafzimmer_rollade_links
        name: Rollladen links
        features:
          - type: cover-open-close
          - type: cover-position
        card_mod: *detail_card
      - type: tile
        grid_options:
          columns: full
        entity: cover.schlafzimmer_schlafzimmer_rollade_rechts
        name: Rollladen rechts
        features:
          - type: cover-open-close
          - type: cover-position
        card_mod: *detail_card
        card_mod: *detail_card
