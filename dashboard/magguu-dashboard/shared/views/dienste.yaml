# Magguu-Dienste: Website, Bot und letzter Deploy. Sensoren aus docs/optional/magguu_dienste.yaml
# (TODO, siehe docs/entities.md); ohne Paket zeigen die Karten „nicht eingerichtet“.
title: Magguu-Dienste
path: dienste
icon: mdi:server-network
subview: true
theme: Magguu Midnight
type: sections
max_columns: 2
sections:
  - type: grid
    column_span: 2
    cards:
      - type: custom:button-card
        grid_options:
          columns: full
        template: page_header_v6
        name: Magguu-Dienste
        icon: mdi:server-network
        variables:
          subtitle: Optional – benötigt das Paket magguu_dienste
          accent: '#6cf2ff'
      - !include ../navbar.yaml

  - type: grid
    column_span: 1
    cards:
      - type: heading
        heading: Dienste
        heading_style: title
      - type: heading
        heading: Erreichbarkeit und Laufzeit
        heading_style: subtitle
      - type: custom:mushroom-template-card
        grid_options:
          columns: full
          rows: auto
        entity: sensor.magguu_website_status
        primary: Website
        secondary: >-
          {% set s = states(entity) %}
          {% if s in ['unknown', 'unavailable'] %}Nicht eingerichtet oder nicht erreichbar
          {% else %}{{ 'Online' if s == 'ok' else s }}
          {%- set ts = state_attr(entity, 'timestamp') %}{% if ts %} · geprüft {{ as_timestamp(ts) | timestamp_custom('%H:%M', true) }}{% endif %}
          {% endif %}
        multiline_secondary: true
        icon: mdi:web
        icon_color: >-
          {% set s = states(entity) %}
          {{ 'green' if s == 'ok' else 'grey' if s in ['unknown', 'unavailable'] else 'red' }}
        tap_action: {action: more-info}
        card_mod: &service_card
          style: |
            ha-card {
              min-height: 92px;
              border-radius: var(--mag-radius-card, 24px);
              background: var(--mag-surface, rgba(24,25,39,.94));
              border: 1px solid var(--mag-border, rgba(255,255,255,.06));
              box-shadow: var(--mag-shadow-card, none);
            }
      - type: custom:mushroom-template-card
        grid_options:
          columns: full
          rows: auto
        entity: sensor.magguu_bot_status
        primary: MagguuBot
        secondary: >-
          {% set s = states(entity) %}
          {% if s in ['unknown', 'unavailable'] %}Nicht eingerichtet oder nicht erreichbar
          {% else %}
            {%- set up = state_attr(entity, 'uptimeSeconds') | int(0) %}
            {%- set build = state_attr(entity, 'build') or {} %}
            Uptime {{ (up // 86400) }}d {{ (up % 86400) // 3600 }}h
            · {{ 'sha-' ~ build.sha[:7] if build.sha else 'Build unbekannt' }}
          {% endif %}
        multiline_secondary: true
        icon: mdi:robot-outline
        icon_color: >-
          {% set s = states(entity) %}
          {{ 'green' if s == 'ok' else 'grey' if s in ['unknown', 'unavailable'] else 'red' }}
        tap_action: {action: more-info}
        card_mod: *service_card

  - type: grid
    column_span: 1
    cards:
      - type: heading
        heading: Letzter Deploy
        heading_style: title
      - type: heading
        heading: Docker-Workflow auf main
        heading_style: subtitle
      - type: custom:mushroom-template-card
        grid_options:
          columns: full
          rows: auto
        entity: sensor.magguu_bot_letzter_deploy
        primary: MagguuBot-Image
        secondary: &deploy_secondary >-
          {% set s = states(entity) %}
          {% if s in ['unknown', 'unavailable'] %}Nicht eingerichtet
          {% else %}
            {%- set sha = state_attr(entity, 'head_sha') or '' %}
            {%- set at = state_attr(entity, 'updated_at') %}
            {{ {'success': 'Erfolgreich', 'failure': 'Fehlgeschlagen', 'cancelled': 'Abgebrochen'}.get(s, s) }}
            · sha-{{ sha[:7] }}{% if at %} · {{ as_timestamp(at) | timestamp_custom('%d.%m. · %H:%M', true) }}{% endif %}
          {% endif %}
        multiline_secondary: true
        icon: mdi:docker
        icon_color: &deploy_color >-
          {% set s = states(entity) %}
          {{ 'green' if s == 'success' else 'red' if s == 'failure'
             else 'grey' if s in ['unknown', 'unavailable'] else 'orange' }}
        tap_action: {action: more-info}
        card_mod: *service_card
      - type: custom:mushroom-template-card
        grid_options:
          columns: full
          rows: auto
        entity: sensor.magguu_website_letzter_deploy
        primary: Website-Image
        secondary: *deploy_secondary
        multiline_secondary: true
        icon: mdi:docker
        icon_color: *deploy_color
        tap_action: {action: more-info}
        card_mod: *service_card

  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: Bot-Webhooks
        heading_style: title
      - type: heading
        heading: Letzter Empfang je Quelle
        heading_style: subtitle
      - type: markdown
        grid_options:
          columns: full
          rows: auto
        entity_id: sensor.magguu_bot_status
        content: >-
          {% set hooks = state_attr('sensor.magguu_bot_status', 'webhooks') %}
          {% if not hooks %}Keine Daten – Paket `docs/optional/magguu_dienste.yaml` noch nicht eingerichtet.
          {% else %}
          {% for name, h in hooks.items() %}
          {{ '🟢' if h.state == 'ok' else '🟠' }} **{{ name | capitalize }}** · {% if h.lastReceivedAt %}{{ as_timestamp(h.lastReceivedAt) | timestamp_custom('%d.%m. · %H:%M', true) }}{% else %}noch nie{% endif %}
          {% endfor %}
          {% endif %}
        card_mod: *service_card

      - type: heading
        heading: FAQ-Nutzung
        heading_style: subtitle
      - type: markdown
        grid_options:
          columns: full
          rows: auto
        entity_id: sensor.magguu_bot_status
        content: |-
          {% set f = state_attr('sensor.magguu_bot_status', 'faq') %}
          {% if not f %}Keine Daten – Bot noch ohne FAQ-Statistik oder Paket nicht eingerichtet.
          {% elif f.total == 0 %}Letzte {{ f.windowDays }} Tage: noch keine FAQ-Nutzung.
          {% else %}
          Letzte {{ f.windowDays }} Tage: **{{ f.total }}** Abrufe · /faq-Suche {{ f.bySource.command }} · Auswahl {{ f.bySource.autocomplete }} · Auto-Antwort {{ f.bySource.autoanswer }}

          {% for t in f.top -%}
          {{ loop.index }}. {{ (t.title if t.title else 'Eintrag ' ~ t.id) | string | replace('*', '') | replace('_', ' ') | replace('`', '') | replace('[', '(') | replace(']', ')') | replace('<', '') | replace('>', '') | replace('|', ' ') | truncate(80) }} · {{ t.count }}×
          {% endfor -%}
          {% endif %}
        card_mod: *service_card

      - type: heading
        heading: Ungesehene Medien (Bericht)
        heading_style: subtitle
      - type: custom:mushroom-template-card
        grid_options:
          columns: full
          rows: auto
        entity: script.magguu_ungesehen_bericht_anzeigen
        primary: Bericht anzeigen (nur Admin)
        secondary: >-
          Nur Bericht – nichts wird gelöscht. Öffnet die Liste für 5 Minuten.
          {% if is_state('input_boolean.magguu_ungesehen_bericht_offen', 'on') %}Gerade geöffnet.{% endif %}
        multiline_secondary: true
        icon: mdi:shield-lock-outline
        icon_color: >-
          {{ 'green' if is_state('input_boolean.magguu_ungesehen_bericht_offen', 'on') else 'purple' }}
        tap_action:
          action: call-service
          service: script.turn_on
          target:
            entity_id: script.magguu_ungesehen_bericht_anzeigen
        hold_action: {action: none}
        card_mod: *service_card
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.magguu_ungesehen_bericht_offen
            state: 'on'
        card:
          type: markdown
          entity_id: sensor.magguu_bot_status
          content: |-
            {% set u = state_attr('sensor.magguu_bot_status', 'unseen') %}
            {% set items = (u['items'] if (u is mapping and u['items'] is iterable and u['items'] is not string and u['items'] is not mapping) else [])[:25] %}
            {% set at = as_timestamp(u['generatedAt'], 0) if u is mapping else 0 %}
            {% set stand = (at | timestamp_custom('%d.%m.%Y · %H:%M', true)) if at else 'unbekannt' %}
            **Nur Bericht – nichts wird gelöscht.** Es gibt keine Löschfunktion, weder im Bot noch hier.
            {% if not u or u is not mapping %}

            Keine Daten – Bot ohne Bericht (Tautulli nicht angebunden, Bericht abgeschaltet, noch nicht berechnet oder älterer Bot) oder Paket nicht eingerichtet.
            {% elif not items %}

            Stand {{ stand }}: keine Titel gefunden, die die Kriterien erfüllen.
            {% else %}

            Stand {{ stand }} · die {{ items | length }} größten Titel, die nie oder seit mindestens {{ (u['staleDays'] if u['staleDays'] is number else 0) | int(0) }} Tagen nicht gesehen wurden und seit mindestens {{ (u['minAgeDays'] if u['minAgeDays'] is number else 0) | int(0) }} Tagen in der Bibliothek sind.

            {% for i in items -%}
            {% set it = i if i is mapping else {} -%}
            {% set size = (it['sizeBytes'] | float(0)) if (it['sizeBytes'] is defined and it['sizeBytes'] is not none) else 0 -%}
            {% set last = as_timestamp(it['lastPlayedAt'], 0) if it['lastPlayedAt'] else 0 -%}
            {{ loop.index }}. {{ it['title'] | string | replace('*', '') | replace('_', ' ') | replace('`', '') | replace('[', '(') | replace(']', ')') | replace('<', '') | replace('>', '') | replace('|', ' ') | truncate(70) }} · {{ (((size / 1000000000000) | round(2) | string | replace('.', ',') ~ ' TB') if size >= 1000000000000 else ((size / 1000000000) | round(1) | string | replace('.', ',') ~ ' GB')) }} · {{ it['library'] | string | replace('*', '') | replace('_', ' ') | replace('`', '') | replace('[', '(') | replace(']', ')') | replace('<', '') | replace('>', '') | replace('|', ' ') | truncate(30) }} · letzte Sicht: {{ (last | timestamp_custom('%d.%m.%Y', true)) if last else ('unbekannt' if it['lastPlayedAt'] else 'nie') }}
            {% endfor %}

            „nie“ heißt: nicht im Tautulli-Verlauf (Wiedergaben von vor Tautulli sind unbekannt).{% if u['partial'] %} Sehr große Bibliothek: nur die größten Einträge wurden geprüft, die Liste kann unvollständig sein.{% endif %}{% if u['clipped'] %} Liste wegen der Größenbegrenzung des Sensor-Attributs gekürzt (nur die größten Titel).{% endif %}
            {% endif %}
          card_mod: *service_card
