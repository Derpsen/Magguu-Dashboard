- title: Home
  path: overview
  icon: mdi:home
  theme: Magguu Midnight
  type: custom:grid-layout
  layout:
    max-width: 1460px
    margin: 0 auto
    padding: 18px 18px 40px
    grid-gap: 14px
    grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr) minmax(310px, .82fr)
    grid-template-areas: |
      "hero hero hero"
      "agenda agenda side"
      "rooms rooms side"
    mediaquery:
      "(max-width: 1080px)":
        grid-template-columns: 1fr 1fr
        grid-template-areas: |
          "hero hero"
          "agenda side"
          "rooms side"
      "(max-width: 760px)":
        grid-template-columns: 1fr
        grid-template-areas: |
          "hero"
          "agenda"
          "side"
          "rooms"
  cards:
    - type: custom:button-card
      template: hero_v5
      variables:
        show_weather: true
      view_layout:
        grid-area: hero

    - type: vertical-stack
      view_layout:
        grid-area: agenda
      cards:
        - type: custom:mushroom-title-card
          title: Als Nächstes
          subtitle: Arbeit, Abfuhr und Termine auf einen Blick
        - type: grid
          columns: 4
          square: false
          cards:
            - type: custom:button-card
              template: next_event_v5
              entity: calendar.arbeiten
              name: Arbeit
              icon: mdi:briefcase-outline
              variables:
                accent: '#b48cff'
            - type: custom:button-card
              template: waste_event_v6
              entity: calendar.abfuhr
              name: Abfuhr
              icon: mdi:trash-can-outline
              variables:
                accent: '#79d98c'
            - type: custom:button-card
              template: next_event_v5
              entity: calendar.privat
              name: Privat
              icon: mdi:account-heart-outline
              variables:
                accent: '#e886ad'
            - type: custom:button-card
              template: next_event_v5
              entity: calendar.termine
              name: Termine
              icon: mdi:calendar-star
              variables:
                accent: '#71b7ff'

    - type: vertical-stack
      view_layout:
        grid-area: rooms
      cards:
        - type: custom:mushroom-title-card
          title: Wohnbereiche
          subtitle: Direkte Steuerung – alle Räume auf der Raumseite
        - !include ../../shared/cards/room-wohnzimmer.yaml
        - !include ../../shared/cards/room-esszimmer.yaml
        - !include ../../shared/cards/room-kueche.yaml
        - type: custom:mushroom-template-card
          primary: Alle Räume öffnen
          secondary: Wohnzimmer, Küche, Bad, Schlaf- und Kinderzimmer
          icon: mdi:floor-plan
          icon_color: purple
          tap_action:
            action: navigate
            navigation_path: /magguu-tablet/raeume
          card_mod:
            style: |
              ha-card { border-radius:20px; background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.045); }

    - type: vertical-stack
      view_layout:
        grid-area: side
      cards:
        - !include ../../shared/cards/attention.yaml
        - !include ../../shared/cards/status-shortcuts.yaml
        - type: custom:mushroom-title-card
          title: Schnellzugriff
          subtitle: Die häufigsten Aktionen
        - type: grid
          columns: 2
          square: false
          cards:
            - type: custom:button-card
              template: quick_v5
              entity: script.magguu_alle_lichter_aus
              name: Licht aus
              icon: mdi:lightbulb-group-off-outline
              variables: { accent: '#ffd166', sub: Hausweit }
              tap_action:
                action: call-service
                service: script.turn_on
                service_data:
                  entity_id: script.magguu_alle_lichter_aus
                confirmation:
                  text: Wirklich alle Lichter im Haus ausschalten?
            - type: custom:button-card
              template: quick_v5
              entity: script.magguu_alle_rollladen_auf
              name: Rollläden auf
              icon: mdi:window-shutter-open
              variables: { accent: '#71b7ff', sub: Alle Räume }
              tap_action:
                action: call-service
                service: script.turn_on
                service_data:
                  entity_id: script.magguu_alle_rollladen_auf
                confirmation:
                  text: Wirklich alle Rollläden im Haus öffnen?
            - type: custom:button-card
              template: quick_v5
              entity: script.magguu_alle_rollladen_zu
              name: Rollläden zu
              icon: mdi:window-shutter
              variables: { accent: '#8d83ff', sub: Alle Räume }
              tap_action:
                action: call-service
                service: script.turn_on
                service_data:
                  entity_id: script.magguu_alle_rollladen_zu
                confirmation:
                  text: Wirklich alle Rollläden im Haus schließen?
            - type: custom:button-card
              template: quick_v5
              entity: switch.wohnzimmer_wohnzimmer_fernseher
              name: Fernseher
              icon: mdi:television
              variables: { accent: '#b48cff', sub: Wohnzimmer }
              tap_action:
                action: toggle
                confirmation:
                  text: Fernseher-Steckdose wirklich umschalten?
        - !include ../../shared/cards/active-media.yaml
        - !include ../../shared/cards/modes.yaml

    - !include ../../shared/navbar.yaml
