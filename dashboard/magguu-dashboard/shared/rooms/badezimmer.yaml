title: Badezimmer
path: badezimmer
icon: mdi:shower
subview: true
theme: Magguu Midnight
type: sections
max_columns: 2
sections:
  - type: grid
    column_span: 2
    cards:
      - type: custom:button-card
        template: room_detail_header_v7
        name: Badezimmer
        icon: mdi:shower
        variables:
          subtitle: Beleuchtung und Wohlfühltemperatur
          accent: '#57cbd3'
          temperature_entity: sensor.magguu_badezimmer_temperatur_c
          humidity_entity: sensor.badezimmer_badezimmer_thermostat_rel_luftfeuchte
          light_count_entity: sensor.magguu_badezimmer_lichter_an
          climate_entity: climate.badezimmer_badezimmer_thermostat

  - type: grid
    cards:
      - type: heading
        heading: Beleuchtung
        heading_style: title
      - type: heading
        heading: Gruppen und Farblicht dimmen
        heading_style: subtitle
      - type: tile
        grid_options:
          columns: full
        entity: light.badezimmer_badezimmer
        name: Badezimmer gesamt
        icon: mdi:lightbulb-group-outline
        color: amber
        features:
          - type: light-brightness
        card_mod: &detail_card
          style: |
            ha-card {
              min-height: 86px;
              border-radius: var(--mag-radius-card, 24px);
              background: var(--mag-surface, rgba(24,25,39,.94));
              border: 1px solid var(--mag-border, rgba(255,255,255,.06));
              box-shadow: var(--mag-shadow-card, none);
            }
      - type: tile
        grid_options:
          columns: full
        entity: light.badezimmer_licht_bad
        name: Hue Licht Bad
        icon: mdi:ceiling-light
        color: amber
        features:
          - type: light-brightness
        card_mod: *detail_card
      - type: tile
        grid_options:
          columns: full
        entity: light.badezimmer_badezimmer_licht_ch8
        name: Farblicht oben
        icon: mdi:led-strip-variant
        color: amber
        features:
          - type: light-brightness
        card_mod: *detail_card
      - type: tile
        grid_options:
          columns: full
        entity: light.badezimmer_badezimmer_licht_ch12
        name: Farblicht unten
        icon: mdi:led-strip-variant
        color: amber
        features:
          - type: light-brightness
        card_mod: *detail_card
      - type: tile
        grid_options:
          columns: full
        entity: switch.badezimmer_badezimmer_licht
        name: Hauptlicht
        icon: mdi:ceiling-light
        features:
          - type: toggle
        card_mod: *detail_card

  - type: grid
    cards:
      - type: heading
        heading: Klima
        heading_style: title
      - type: heading
        heading: Heizung und 48-Stunden-Verlauf
        heading_style: subtitle
      - type: tile
        grid_options:
          columns: full
        entity: climate.badezimmer_badezimmer_thermostat
        name: Badezimmer
        features:
          - type: target-temperature
        card_mod: *detail_card
      - type: custom:mini-graph-card
        name: Temperatur · 48 Stunden
        hours_to_show: 48
        points_per_hour: 1
        line_width: 2
        show: {labels: true, legend: false, fill: fade}
        entities:
          - sensor.magguu_badezimmer_temperatur_c
        card_mod: *detail_card
