- title: Home
  path: overview
  icon: mdi:home
  theme: Magguu Midnight
  type: custom:grid-layout
  layout:
    margin: 0 auto
    padding: 10px 10px 96px
    grid-gap: 12px
    grid-template-columns: 1fr
  cards:
    - type: custom:button-card
      template: hero_v5
    - !include ../../shared/cards/attention.yaml
    - !include ../../shared/cards/status-shortcuts.yaml
    - type: grid
      columns: 2
      square: false
      cards:
        - type: custom:button-card
          template: next_event_v5
          entity: calendar.arbeiten
          name: Arbeit
          icon: mdi:briefcase-outline
          variables: { accent: '#b48cff' }
        - type: custom:button-card
          template: waste_event_v6
          entity: calendar.abfuhr
          name: Abfuhr
          icon: mdi:trash-can-outline
          variables: { accent: '#79d98c' }
        - type: custom:button-card
          template: next_event_v5
          entity: calendar.privat
          name: Privat
          icon: mdi:account-heart-outline
          variables: { accent: '#e886ad' }
        - type: custom:button-card
          template: next_event_v5
          entity: calendar.termine
          name: Termine
          icon: mdi:calendar-star
          variables: { accent: '#71b7ff' }
    - type: weather-forecast
      entity: weather.forecast_home
      name: Wetter
      forecast_type: daily
      card_mod:
        style: |
          ha-card { border-radius:28px; background:rgba(24,25,39,.94); border:1px solid rgba(255,255,255,.055); box-shadow:none; }
    - !include ../../shared/cards/active-media.yaml
    - type: custom:mushroom-title-card
      title: Räume
      subtitle: Direkt steuern oder Raum öffnen
    - !include ../../shared/cards/room-wohnzimmer.yaml
    - !include ../../shared/cards/room-esszimmer.yaml
    - !include ../../shared/cards/room-kueche.yaml
    - type: custom:mushroom-template-card
      primary: Alle Räume
      secondary: Vollständige Raumübersicht öffnen
      icon: mdi:floor-plan
      icon_color: purple
      tap_action:
        action: navigate
        navigation_path: /magguu-mobile/raeume
    - !include ../../shared/cards/home-quick.yaml
    - !include ../../shared/cards/modes.yaml
    - !include ../../shared/navbar.yaml
