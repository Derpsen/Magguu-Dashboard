type: grid
column_span: 1
cards:
  - type: conditional
    grid_options:
      columns: full
      rows: auto
    conditions:
      - entity: binary_sensor.magguu_wohnzimmer_heizwarnung
        state: 'on'
    card:
      type: custom:mushroom-template-card
      entity: binary_sensor.magguu_wohnzimmer_heizwarnung
      primary: Wohnzimmer · Fenster & Heizung
      secondary: Fenster offen, während die Heizung aktiv heizt
      multiline_secondary: true
      icon: mdi:radiator-off
      icon_color: orange
      tap_action:
        action: navigate
        navigation_path: wohnzimmer
      hold_action:
        action: more-info
      card_mod: &warning_card
        style: |
          ha-card {
            border: 1px solid color-mix(in srgb, var(--mag-accent-warning, #ff9f43) 48%, transparent);
            animation: magguu-warning-pulse 2.8s ease-in-out infinite;
          }
          @keyframes magguu-warning-pulse {
            0%, 100% { box-shadow: 0 0 0 rgba(255,159,67,0); }
            50% { box-shadow: 0 0 18px rgba(255,159,67,.16); }
          }
          @media (prefers-reduced-motion: reduce) {
            ha-card { animation: none; }
          }

  - type: conditional
    grid_options:
      columns: full
      rows: auto
    conditions:
      - entity: binary_sensor.magguu_schlafzimmer_heizwarnung
        state: 'on'
    card:
      type: custom:mushroom-template-card
      entity: binary_sensor.magguu_schlafzimmer_heizwarnung
      primary: Schlafzimmer · Fenster & Heizung
      secondary: Fenster offen, während die Heizung aktiv heizt
      multiline_secondary: true
      icon: mdi:radiator-off
      icon_color: orange
      tap_action:
        action: navigate
        navigation_path: schlafzimmer
      hold_action:
        action: more-info
      card_mod: *warning_card

  - type: conditional
    grid_options:
      columns: full
      rows: auto
    conditions:
      - entity: binary_sensor.magguu_kinderzimmer_heizwarnung
        state: 'on'
    card:
      type: custom:mushroom-template-card
      entity: binary_sensor.magguu_kinderzimmer_heizwarnung
      primary: Kinderzimmer · Fenster & Heizung
      secondary: Fenster offen, während die Heizung aktiv heizt
      multiline_secondary: true
      icon: mdi:radiator-off
      icon_color: orange
      tap_action:
        action: navigate
        navigation_path: kinderzimmer
      hold_action:
        action: more-info
      card_mod: *warning_card


  - type: conditional
    grid_options:
      columns: full
      rows: auto
    conditions:
      - entity: sensor.magguu_offene_fenster
        state_not: '0'
    card:
      type: vertical-stack
      cards:
        - type: heading
          heading: Offene Fenster & Türen
          heading_style: title
        - type: heading
          heading: Antippen öffnet die jeweilige Detailansicht
          heading_style: subtitle

  - type: conditional
    grid_options:
      columns: full
      rows: auto
    conditions:
      - entity: binary_sensor.wohnzimmer_wohnzimmer_fenster
        state: 'on'
    card:
      type: custom:mushroom-template-card
      entity: binary_sensor.wohnzimmer_wohnzimmer_fenster
      primary: Wohnzimmer · Fenster
      secondary: Geöffnet · Antippen für Details
      icon: mdi:window-open-variant
      icon_color: orange
      tap_action:
        action: more-info

  - type: conditional
    grid_options:
      columns: full
      rows: auto
    conditions:
      - entity: sensor.wohnzimmer_wohnzimmer_fenstertur
        state_not: closed
      - entity: sensor.wohnzimmer_wohnzimmer_fenstertur
        state_not: 'off'
      - entity: sensor.wohnzimmer_wohnzimmer_fenstertur
        state_not: unknown
      - entity: sensor.wohnzimmer_wohnzimmer_fenstertur
        state_not: unavailable
    card:
      type: custom:mushroom-template-card
      entity: sensor.wohnzimmer_wohnzimmer_fenstertur
      primary: Wohnzimmer · Fenstertür
      secondary: >-
        {{ 'Gekippt' if states(entity) == 'tilted' else 'Geöffnet' }} · Antippen für Details
      icon: mdi:door-open
      icon_color: orange
      tap_action:
        action: more-info

  - type: conditional
    grid_options:
      columns: full
      rows: auto
    conditions:
      - entity: binary_sensor.magguu_kueche_oeffnung
        state: 'on'
    card:
      type: custom:mushroom-template-card
      entity: binary_sensor.magguu_kueche_oeffnung
      primary: Küche · Fenster / Tür
      secondary: >-
        {{ 'Gekippt' if states('sensor.kuche_kuche_fenstertur') == 'tilted' else 'Geöffnet' }} · Antippen für Details
      icon: mdi:door-open
      icon_color: orange
      tap_action:
        action: more-info

  - type: conditional
    grid_options:
      columns: full
      rows: auto
    conditions:
      - entity: binary_sensor.schlafzimmer_schlafzimmer_fenstertur
        state: 'on'
    card:
      type: custom:mushroom-template-card
      entity: binary_sensor.schlafzimmer_schlafzimmer_fenstertur
      primary: Schlafzimmer · Fenster / Tür
      secondary: Geöffnet · Antippen für Details
      icon: mdi:window-open-variant
      icon_color: orange
      tap_action:
        action: more-info

  - type: conditional
    grid_options:
      columns: full
      rows: auto
    conditions:
      - entity: binary_sensor.kinderzimmer_kinderzimmer_fenster
        state: 'on'
    card:
      type: custom:mushroom-template-card
      entity: binary_sensor.kinderzimmer_kinderzimmer_fenster
      primary: Kinderzimmer · Fenster
      secondary: Geöffnet · Antippen für Details
      icon: mdi:window-open-variant
      icon_color: orange
      tap_action:
        action: more-info
