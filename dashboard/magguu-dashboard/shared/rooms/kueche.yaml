title: Küche
path: kueche
icon: mdi:countertop-outline
subview: true
theme: Magguu Midnight
type: sections
max_columns: 2
sections:
  - type: grid
    column_span: 2
    cards:
      - type: custom:button-card
        template: room_detail_header_v7
        name: Küche
        icon: mdi:countertop-outline
        variables:
          subtitle: Licht, Rollladen und Öffnungsstatus
          accent: '#79d98c'
          opening_entity: binary_sensor.magguu_kueche_oeffnung
          light_count_entity: sensor.magguu_kueche_lichter_an

  - type: grid
    cards:
      - type: heading
        heading: Beleuchtung
        heading_style: title
      - type: heading
        heading: Küchenlicht direkt schalten
        heading_style: subtitle
      - type: tile
        grid_options:
          columns: full
        entity: switch.kuche_kuche_licht
        name: Küchenlicht
        icon: mdi:ceiling-light
        features:
          - type: toggle
        card_mod: &detail_card
          style: |
            ha-card {
              min-height: 86px;
              border-radius: var(--mag-radius-card, 24px);
              background: var(--mag-surface, rgba(24,25,39,.94));
              border: 1px solid var(--mag-border, rgba(255,255,255,.06));
              box-shadow: var(--mag-shadow-card, none);
            }

  - type: grid
    cards:
      - type: heading
        heading: Rollladen
        heading_style: title
      - type: heading
        heading: Position gezielt einstellen
        heading_style: subtitle
      - type: tile
        grid_options:
          columns: full
        entity: cover.kuche_kuche_rollade
        name: Rollladen Küche
        features:
          - type: cover-open-close
          - type: cover-position
        card_mod: *detail_card
